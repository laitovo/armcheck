<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Device Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #13131a; --border: #1e1e2e;
    --accent-ar: #00e5a0; --accent-mr: #7c6cff; --accent-no: #ff4d6d;
    --text: #e8e8f0; --muted: #6b6b80;
    --font-head: 'Syne', sans-serif; --font-mono: 'Space Mono', monospace;
  }
  html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-head); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1rem;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124,108,255,.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,229,160,.06) 0%, transparent 50%);
  }
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(30,30,46,.5) 1px,transparent 1px), linear-gradient(90deg,rgba(30,30,46,.5) 1px,transparent 1px);
    background-size: 60px 60px;
  }
  .wrapper { position: relative; z-index: 1; width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; }
  .header { text-align: center; }
  .header .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent-ar); margin-bottom: .75rem; }
  .header h1 { font-size: clamp(2rem,6vw,3.2rem); font-weight: 800; line-height: 1.05; letter-spacing: -.03em; }
  .header h1 span { background: linear-gradient(135deg,var(--accent-ar),var(--accent-mr)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header p { margin-top: .75rem; color: var(--muted); font-size: .9rem; font-family: var(--font-mono); line-height: 1.6; }
  .search-box { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; gap: .75rem; transition: border-color .2s; }
  .search-box:focus-within { border-color: var(--accent-mr); }
  .input-row { display: flex; gap: .75rem; align-items: stretch; }
  .input-wrap { flex: 1; position: relative; }
  input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: .85rem 1rem; font-family: var(--font-head); font-size: 1rem; color: var(--text); outline: none; transition: border-color .2s; }
  input[type="text"]:focus { border-color: var(--accent-mr); }
  input[type="text"]::placeholder { color: var(--muted); }
  button.check-btn { background: linear-gradient(135deg,var(--accent-ar),var(--accent-mr)); border: none; border-radius: 10px; padding: .85rem 1.5rem; font-family: var(--font-head); font-size: .95rem; font-weight: 700; color: #0a0a0f; cursor: pointer; white-space: nowrap; transition: opacity .15s, transform .1s; letter-spacing: -.01em; }
  button.check-btn:hover { opacity: .9; }
  button.check-btn:active { transform: scale(.97); }
  .suggestions { display: none; flex-direction: column; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg); max-height: 220px; overflow-y: auto; }
  .suggestions.visible { display: flex; }
  .suggestion-item { padding: .65rem 1rem; cursor: pointer; font-family: var(--font-mono); font-size: .82rem; color: var(--muted); transition: background .1s, color .1s; border-bottom: 1px solid var(--border); line-height: 1.4; }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover, .suggestion-item.active { background: var(--surface); color: var(--text); }
  .suggestion-item .mfr { font-size: .72rem; color: var(--accent-ar); margin-right: .4rem; }
  .suggestion-item .depth-tag { float: right; font-size: .68rem; padding: 1px 6px; border-radius: 4px; background: rgba(124,108,255,.15); color: var(--accent-mr); }
  .result { display: none; width: 100%; border-radius: 16px; padding: 1.75rem; position: relative; overflow: hidden; animation: fadeUp .3s ease; }
  .result.visible { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .result.ar-only { background: rgba(0,229,160,.05); border: 1px solid rgba(0,229,160,.25); }
  .result.ar-mr { background: rgba(124,108,255,.07); border: 1px solid rgba(124,108,255,.3); }
  .result.not-found { background: rgba(255,77,109,.05); border: 1px solid rgba(255,77,109,.2); }
  .result-glow { position: absolute; top: -40px; right: -40px; width: 140px; height: 140px; border-radius: 50%; filter: blur(40px); pointer-events: none; }
  .ar-only .result-glow { background: rgba(0,229,160,.2); }
  .ar-mr .result-glow { background: rgba(124,108,255,.25); }
  .not-found .result-glow { background: rgba(255,77,109,.15); }
  .result-badge { font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-bottom: .75rem; }
  .ar-only .result-badge { background: rgba(0,229,160,.15); color: var(--accent-ar); }
  .ar-mr .result-badge { background: rgba(124,108,255,.15); color: var(--accent-mr); }
  .not-found .result-badge { background: rgba(255,77,109,.15); color: var(--accent-no); }
  .result-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: .4rem; }
  .ar-only .result-title { color: var(--accent-ar); }
  .ar-mr .result-title { color: #a89cff; }
  .not-found .result-title { color: var(--accent-no); }
  .result-device { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); margin-bottom: 1rem; }
  .caps-list { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  .cap { font-family: var(--font-mono); font-size: .72rem; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,.05); color: var(--muted); }
  .cap.on { background: rgba(0,229,160,.1); color: var(--accent-ar); }
  .cap.on.depth { background: rgba(124,108,255,.1); color: #a89cff; }
  .result-desc { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); line-height: 1.6; margin-top: .5rem; }
  .footer { font-family: var(--font-mono); font-size: .68rem; color: var(--muted); text-align: center; }
  .footer a { color: var(--accent-ar); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .suggestions::-webkit-scrollbar { width: 4px; }
  .suggestions::-webkit-scrollbar-track { background: transparent; }
  .suggestions::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="wrapper">
  <div class="header">
    <div class="label">ARCore Device Checker</div>
    <h1>Проверь <span>AR / MR</span><br>поддержку</h1>
    <p>Введи модель устройства — узнай,<br>поддерживает ли оно ARCore и Depth API</p>
  </div>
  <div class="search-box">
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" id="deviceInput" placeholder="Например: Samsung Galaxy S24, Pixel 8..." autocomplete="off" spellcheck="false">
      </div>
      <button class="check-btn" onclick="checkDevice()">Проверить</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>
  <div class="result" id="result">
    <div class="result-glow"></div>
    <div class="result-badge" id="resultBadge"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-device" id="resultDevice"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="caps-list" id="capsList"></div>
  </div>
  <div class="footer">
    Данные: <a href="https://developers.google.com/ar/devices" target="_blank">developers.google.com/ar/devices</a>
    &nbsp;·&nbsp; 1215 устройств · Google Play + Android China · обновлено июнь 2026
  </div>
</div>

const searchIndex = DEVICES.map(([mfr, model, depth]) => ({
  mfr, model, depth,
  searchKey: (mfr + ' ' + model).toLowerCase()
    .replace(/[⁵ˢ⁶⁷⁸⁹²³⁴]/g, s => ({'⁵':'5','ˢ':'s','⁶':'6','⁷':'7','⁸':'8','⁹':'9','²':'2','³':'3','⁴':'4'}[s]||s))
    .replace(/[^\w\s]/g, ' ')
}));

function nq(q) {
  return q.toLowerCase().trim()
    .replace(/[⁵ˢ⁶⁷⁸⁹²³⁴]/g, s => ({'⁵':'5','ˢ':'s','⁶':'6','⁷':'7','⁸':'8','⁹':'9','²':'2','³':'3','⁴':'4'}[s]||s))
    .replace(/[^\w\s]/g, ' ');
}

function findMatches(query, limit=8) {
  if (!query || query.length < 2) return [];
  const words = nq(query).split(/\s+/).filter(Boolean);
  return searchIndex.filter(d => words.every(w => d.searchKey.includes(w))).slice(0, limit);
}

function findBestMatch(query) {
  const words = nq(query).split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  const matches = searchIndex.filter(d => words.every(w => d.searchKey.includes(w)));
  if (!matches.length) return null;
  matches.sort((a, b) => Math.abs(a.searchKey.length - nq(query).length) - Math.abs(b.searchKey.length - nq(query).length));
  return matches[0];
}

const input = document.getElementById('deviceInput');
const suggestionsEl = document.getElementById('suggestions');
const resultEl = document.getElementById('result');
let activeIdx = -1, currentSuggestions = [];

input.addEventListener('input', () => {
  currentSuggestions = findMatches(input.value);
  activeIdx = -1;
  renderSuggestions(currentSuggestions);
});

input.addEventListener('keydown', e => {
  if (!currentSuggestions.length) { if (e.key==='Enter') checkDevice(); return; }
  if (e.key==='ArrowDown') { e.preventDefault(); activeIdx=Math.min(activeIdx+1,currentSuggestions.length-1); updateActive(); }
  else if (e.key==='ArrowUp') { e.preventDefault(); activeIdx=Math.max(activeIdx-1,-1); updateActive(); }
  else if (e.key==='Enter') { e.preventDefault(); activeIdx>=0 ? selectSuggestion(currentSuggestions[activeIdx]) : checkDevice(); }
  else if (e.key==='Escape') hideSuggestions();
});

document.addEventListener('click', e => { if (!e.target.closest('.search-box')) hideSuggestions(); });

function renderSuggestions(items) {
  if (!items.length) { hideSuggestions(); return; }
  suggestionsEl.innerHTML = items.map((d,i) =>
    `<div class="suggestion-item" data-idx="${i}"><span class="mfr">${d.mfr}</span>${d.model}${d.depth?'<span class="depth-tag">Depth API</span>':''}</div>`
  ).join('');
  suggestionsEl.classList.add('visible');
  suggestionsEl.querySelectorAll('.suggestion-item').forEach((el,i) => {
    el.addEventListener('click', () => selectSuggestion(currentSuggestions[i]));
    el.addEventListener('mouseenter', () => { activeIdx=i; updateActive(); });
  });
}

function updateActive() {
  suggestionsEl.querySelectorAll('.suggestion-item').forEach((el,i) => el.classList.toggle('active', i===activeIdx));
}

function hideSuggestions() { suggestionsEl.classList.remove('visible'); suggestionsEl.innerHTML=''; }

function selectSuggestion(d) { input.value=d.mfr+' '+d.model; hideSuggestions(); showResult(d); }

function checkDevice() {
  hideSuggestions();
  const q = input.value.trim();
  if (!q) return;
  const d = findBestMatch(q);
  d ? showResult(d) : showNotFound(q);
}

function showResult(d) {
  resultEl.className = 'result visible ' + (d.depth ? 'ar-mr' : 'ar-only');
  document.getElementById('resultBadge').textContent = d.depth ? '✦ AR + MR поддерживается' : '✦ AR поддерживается';
  document.getElementById('resultTitle').textContent = d.depth ? 'Поддерживает AR и MR' : 'Поддерживает AR';
  document.getElementById('resultDevice').textContent = d.mfr + ' · ' + d.model;
  document.getElementById('resultDesc').textContent = d.depth
    ? 'Устройство сертифицировано ARCore и поддерживает Depth API (API глубины) — необходимый для MR: окклюзия объектов, смешанная реальность.'
    : 'Устройство сертифицировано ARCore и поддерживает базовый AR. Depth API (необходимый для MR) на этом устройстве недоступен.';
  document.getElementById('capsList').innerHTML =
    `<span class="cap on">ARCore</span><span class="cap on">Трекинг движения</span><span class="cap on">Распознавание плоскостей</span>` +
    (d.depth
      ? `<span class="cap on depth">Depth API</span><span class="cap on depth">Окклюзия</span><span class="cap on depth">MR-режим</span>`
      : `<span class="cap">Depth API</span><span class="cap">MR-режим</span>`);
}

function showNotFound(q) {
  resultEl.className = 'result visible not-found';
  document.getElementById('resultBadge').textContent = '✕ Не найдено';
  document.getElementById('resultTitle').textContent = 'Устройство не найдено';
  document.getElementById('resultDevice').textContent = `Запрос: "${q}"`;
  document.getElementById('resultDesc').textContent = 'Устройство отсутствует в списке сертифицированных ARCore устройств. Проверь название — возможно, оно написано иначе.';
  document.getElementById('capsList').innerHTML =
    `<a href="https://developers.google.com/ar/devices" target="_blank" style="font-family:var(--font-mono);font-size:.75rem;color:var(--accent-no);text-decoration:none;border-bottom:1px solid rgba(255,77,109,.3);">Открыть полный список →</a>`;
}
